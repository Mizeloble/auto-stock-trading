<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}auto-trade 대시보드{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-56 bg-slate-900 border-r border-slate-800 flex flex-col">
      <div class="px-4 py-5 border-b border-slate-800">
        <h1 class="font-semibold text-lg">auto-trade</h1>
        <p class="text-xs text-slate-400 mt-1">투자 결과 대시보드</p>
      </div>
      <nav class="flex-1 px-2 py-4 space-y-1">
        <a href="/" class="block px-3 py-2 rounded text-sm {% if page == 'overview' %}bg-indigo-600{% else %}hover:bg-slate-800{% endif %}">개요</a>
        <a href="/daily" class="block px-3 py-2 rounded text-sm {% if page == 'daily' %}bg-indigo-600{% else %}hover:bg-slate-800{% endif %}">일별 상세</a>
        <a href="/backtests" class="block px-3 py-2 rounded text-sm {% if page == 'backtests' %}bg-indigo-600{% else %}hover:bg-slate-800{% endif %}">백테스트</a>
      </nav>
      <div class="px-4 py-3 text-xs text-slate-500 border-t border-slate-800 leading-relaxed">
        로컬 전용<br>127.0.0.1
      </div>
    </aside>
    <main class="flex-1 p-6 overflow-x-hidden">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
