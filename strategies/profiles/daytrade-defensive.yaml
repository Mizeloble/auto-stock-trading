# day-trade TREND_DOWN 프로파일 — 약세장(하락추세) 전용.
# ⚠️ 레짐 라우터가 켜져 있으면 daytrade-current.yaml 대신 *이 파일이 실제 적용*된다.
#    회피 종목은 시동 시 daytrade-current 의 목록과 자동 합집합 병합 (2026-07-04).
# 베이스: daytrade-current.yaml (작성 시점 기준 — current 갱신 시 어긋날 수 있음).
# 조정 사유: 약세장에서는 진입 자체를 줄이고 손절 폭만 좁힘 (회전율 최우선 차단).
#   top_n 2 (후보 절반)
#   daily_notional_limit 20M (2026-07-29 계좌 리셋 반영 — 아래 📌 참고)
#   max_buys_per_symbol 1 (종목당 하루 1회만)
#   stop_loss_pct 0.012 (-1.2%, 손절 좁게 — 약세장 추가 하락 위험)
#   trailing_stop_pct 0.008 (트레일링 좁게)
#   cooldown_min 60 — current 와 동일(현 60). 쿨다운 축은 2026-07-04 반사실 검증으로 현행 유지 종결.
# 2026-07-04: max_position_weight/max_portfolio_exposure 누락 보정 — 누락이면 엔진
#   기본(20%/80%)이 적용돼 약세장 프로파일이 오히려 다른 프로파일(10%/60%)보다
#   느슨했다. 다른 프로파일과 같은 10%/60% 로 명시(완화 아님 — 조임).
#
# 📌 2026-07-29 · 모의계좌 재발급으로 예수금 4,800만 → 1억 (2배).
#   기존 캡 10M 은 "2종목 풀배치 1회분"(4,800만 × 10% × 2 ≈ 960만)에 맞춘 값이라,
#   계좌가 2배가 되면 요청액 2,000만 중 1종목에서 캡이 걸려 분산이 사라진다.
#   캡도 2배(20M)로 올려 기존 비율을 유지. highvol 과 동일한 사유.
name: daytrade defensive
strategy: index_momentum_daytrade
top_n: 2
exclude_etf: true
liquidate: '15:15'
discover_delay_sec: 360
params:
  cooldown_min: 60
  momentum_lookback_min: 15
  momentum_threshold_pct: 0.25
risk:
  stop_loss_pct: 0.012
  trailing_stop_pct: 0.008
  partial_take_pct: 0.018
  partial_take_qty_ratio: 0.5
  max_order_value: 0.0
  daily_notional_limit: 20000000.0
  # 2026-07-04 보정 — 누락 시 엔진 기본 20%/80% 가 적용돼 약세장인데 가장 느슨했음.
  max_position_weight: 0.10
  max_portfolio_exposure: 0.60
  daily_loss_kill: true
  max_consecutive_losses: 3
  consecutive_loss_pause_sec: 86400
  max_position_correlation: 0.7
  max_buys_per_symbol: 1
  # churn 브레이크 — 그날 실현손실(비용 차감)이 15만원 쌓이면 신규 매수 자동 중단.
  # 2026-06-11 ledger 역산 검증. 약세장 프로파일은 노출이 절반이라 도달 자체가 드묾.
  daily_realized_loss_limit: 150000.0
avoid_symbols:
  - '356680'
breadth_gate:
  enabled: true
  min_advancing_pct: 0.5
  min_mean_change_pct: 0.0
  snapshot_dir: data/snapshots
notes: |
  TREND_DOWN 자동 라우팅용. 회전율·노출 모두 절반 + 손절 좁게.
  약세장 자동 보수 전환의 핵심 — 사용자 메모리 project_after_cost_loss 의 "과매매 차단" 원칙 강화.
