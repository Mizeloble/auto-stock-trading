# day-trade TREND_UP 프로파일 — 상승추세장 전용.
# ⚠️ 레짐 라우터가 켜져 있으면 daytrade-current.yaml 대신 *이 파일이 실제 적용*된다.
#    회피 종목은 시동 시 daytrade-current 의 목록과 자동 합집합 병합 (2026-07-04).
# 베이스: daytrade-current.yaml (작성 시점 기준 — current 갱신 시 어긋날 수 있음).
# 조정 사유: 추세장에서는 진입 기회가 많아도 비용/회전율 통제 원칙 우선.
#   top_n 6 (하루 최대 매수 종목 6개 — current 3 보다 많음)
#   momentum_threshold_pct 0.20 (지수 상승 모멘텀 게이트 완화 — current 0.30)
#   cooldown_min 60 — current 와 동일(현 60). 쿨다운 축은 2026-07-04 반사실 검증으로 현행 유지 종결.
#   max_position_weight 0.10 / max_portfolio_exposure 0.60
#     → 종목당 총평가금액의 10%, 전체 합산 최대 60%(=6종목×10%). 손절·트레일링·부분익절은 불변.
#
# 📌 2026-07-29 · 모의계좌 재발급으로 예수금 4,800만 → 1억 (2배).
#   종목당 예산 = 평가액 × max_position_weight 라 매수 요청액만 2배가 되는데 캡은
#   그대로여서, 계좌 대비 캡 비율이 42% → 21% 로 반토막 난다(6종목 요청 6,000만 vs
#   캡 2,000만). daily_notional_limit 20M → 40M 으로 원래 비율 복원.
#   절대금액이 2배가 되는 것은 의도된 결과. current·range 도 동일 사유로 40M.
name: daytrade trend
strategy: index_momentum_daytrade
top_n: 6
exclude_etf: true
liquidate: '15:15'
discover_delay_sec: 360
params:
  cooldown_min: 60
  momentum_lookback_min: 15
  momentum_threshold_pct: 0.20
risk:
  stop_loss_pct: 0.018
  trailing_stop_pct: 0.012
  partial_take_pct: 0.018
  partial_take_qty_ratio: 0.5
  max_order_value: 0.0
  daily_notional_limit: 40000000.0
  max_position_weight: 0.10
  max_portfolio_exposure: 0.60
  daily_loss_kill: true
  max_consecutive_losses: 3
  consecutive_loss_pause_sec: 86400
  max_position_correlation: 0.7
  max_buys_per_symbol: 2
  # churn 브레이크 — 그날 실현손실(비용 차감)이 15만원 쌓이면 신규 매수 자동 중단.
  # 2026-06-11 ledger 역산 검증 (5/12 만 발동, 다른 날 오발동 0). 0 이면 비활성.
  daily_realized_loss_limit: 150000.0
avoid_symbols:
  - '356680'
breadth_gate:
  enabled: true
  min_advancing_pct: 0.5
  min_mean_change_pct: 0.0
  snapshot_dir: data/snapshots
notes: |
  TREND_UP 자동 라우팅용. daytrade-current.yaml 베이스 + top_n=6, momentum 게이트 약간 완화.
  daily_notional_limit·max_buys_per_symbol·cooldown_min(60) 은 current 와 동일.
  쿨다운 축은 2026-07-04 반사실 검증으로 현행 유지 종결.
