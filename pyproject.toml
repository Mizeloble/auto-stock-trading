[project]
name = "auto-trading"
version = "0.1.0"
description = "키움증권 REST API 기반 자동 주식 매매 봇 (모의투자 우선)"
readme = "README.md"
authors = [
    { name = "Mizeloble", email = "mizeloble@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.97.0",
    "fastapi>=0.136.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "typer>=0.24.2",
    "uvicorn>=0.46.0",
    "websockets>=16.0",
]

[project.scripts]
auto-trade = "auto_trading.cli:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.11",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 통합 테스트는 키움 토큰 발급 rate limit (au10001) 회피를 위해 세션 1회만 발급해
# 공유한다 — fixture/test 모두 session 루프 스코프 사용. 단위 테스트는 모두
# respx/monkeypatch 로 격리돼 있어 session 루프 공유에도 안전.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 기본 실행 시 통합 테스트는 제외. `pytest -m integration` 으로 명시 선택 시에만 실행.
addopts = "-m 'not integration'"
markers = [
    "integration: 실 API(모의투자 포함) 호출 테스트. KIWOOM_APP_KEY 필요",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter 가 처리)
    "B008",  # function default (typer Option 패턴 충돌)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false   # 초기 도입 단계는 관대 — 점진 강화 예정
ignore_missing_imports = true
