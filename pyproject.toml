[project]
name = "auto-trading"
version = "0.1.0"
description = "키움증권 REST API 기반 자동 주식 매매 봇 (모의투자 우선)"
readme = "README.md"
authors = [
    { name = "Mizeloble", email = "mizeloble@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
    "typer>=0.24.2",
    "websockets>=16.0",
]

[project.scripts]
auto-trade = "auto_trading.cli:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 실 API(모의투자 포함) 호출 테스트. KIWOOM_APP_KEY 필요",
]
